# Main GitLab CI/CD Pipeline
# Save as .gitlab-ci.yml

variables:
  FILES_PATH: 'ProjectSnapshot'
  BRANCH_NAME: 'descope/update-snapshot-${CI_PIPELINE_ID}'
  # DESCOPE_BASE_URL is intentionally not declared here. Define it as a CI/CD
  # variable to override the Descope API base URL (e.g. for the EU region);
  # leaving it undeclared keeps it absent from the job env so the CLI uses its
  # own default rather than receiving an empty value.

stages:
  - create_merge_req_from_staging
  - deploy_to_production

# ==========================================
# Shared definitions
# ==========================================

# Base image for every job. Pinned deliberately: 'ubuntu:latest' moves between
# LTS releases and has broken this pipeline before (24.04 removed apt-key).
# Bump this on purpose, in one place.
.descope_base:
  image: ubuntu:24.04

# Reusable script snippets, pulled into jobs with !reference so there is a
# single copy of each. Hidden jobs are never executed on their own.
.snippets:
  # Fail fast with a clear message if a required variable is missing or empty.
  # The usual cause is a "Protected" CI/CD variable on an unprotected branch,
  # which GitLab silently omits from the job environment.
  # Reads the space-separated variable names from $REQUIRED_VARS, which each
  # job sets in its own `variables:` block.
  check_required_vars:
    - |
      if [ -z "${REQUIRED_VARS:-}" ]; then
        echo "ERROR: this job references .snippets:check_required_vars but does not"
        echo "set REQUIRED_VARS, so nothing would be checked. Add it to the job's"
        echo "'variables:' block as a space-separated list of variable names."
        exit 1
      fi

      MISSING=""
      # Intentionally unquoted: $REQUIRED_VARS is a space-separated name list.
      for VAR in $REQUIRED_VARS; do
        eval "VALUE=\${$VAR:-}"
        if [ -z "$VALUE" ]; then
          MISSING="$MISSING $VAR"
        fi
      done
      if [ -n "$MISSING" ]; then
        echo "ERROR: missing or empty CI/CD variable(s):$MISSING"
        echo "Set them in Settings -> CI/CD -> Variables."
        echo "If they are already set, check that they are not marked 'Protected'"
        echo "while this pipeline runs on an unprotected branch ($CI_COMMIT_REF_NAME)."
        exit 1
      fi

  # Adds the Descope apt repository and installs the CLI.
  # Requires curl to already be installed.
  install_descope_cli:
    - |
      mkdir -p /etc/apt/keyrings
      curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xe8365d8513142909" -o /etc/apt/keyrings/descope.asc
      echo "deb [signed-by=/etc/apt/keyrings/descope.asc] https://descope.github.io/packages stable main" | tee /etc/apt/sources.list.d/descope.list
      apt-get update
      apt-get install -y descope

# ==========================================
# STAGE 1: Manual Export and Create MR
# ==========================================

export_and_create_mr:
  extends: .descope_base
  stage: create_merge_req_from_staging
  variables:
    REQUIRED_VARS: 'GITLAB_PUSH_TOKEN MANAGEMENT_KEY STAGING_PROJECT_ID'
    MERGE_REQUEST_TITLE: 'Update snapshot from staging project'
    MERGE_REQUEST_BODY: |
      ### Description
      Snapshot exported from staging project.
      
      ### Changes
      CHANGES_LIST
  before_script:
    # Validate configuration before spending time on installs.
    - !reference [.snippets, check_required_vars]
    # Install required tools
    - apt-get update && apt-get install -y git curl jq
  script:
    - |
      # Configure git
      git config --global user.email "${GITLAB_USER_EMAIL:-$GITLAB_USER_ID+$GITLAB_USER_LOGIN@users.noreply.gitlab.com}"
      git config --global user.name "${GITLAB_USER_NAME:-$GITLAB_USER_LOGIN}"

      # Clone repository
      git clone "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo
      cd repo
      git checkout -b "$BRANCH_NAME"
    # All script entries share one shell, so the working directory set above
    # (repo/) still applies to the snippet below and to the rest of the script.
    - !reference [.snippets, install_descope_cli]
    - |
      # Export snapshot
      mkdir -p "$FILES_PATH"
      export DESCOPE_MANAGEMENT_KEY=$MANAGEMENT_KEY
      # DESCOPE_BASE_URL, if set as a CI/CD variable, is already in the job env
      if [ -n "$DESCOPE_BASE_URL" ]; then echo "Using Descope base URL: $DESCOPE_BASE_URL"; fi
      descope project snapshot export "$STAGING_PROJECT_ID" --path "$FILES_PATH"
      
      # Check for changes
      if [ -z "$(git status --porcelain "$FILES_PATH")" ]; then
        echo "No changes detected - exiting"
        exit 0
      fi
      
      # Create changes list
      CHANGES_FILE=$(mktemp)
      FORMATTED_CHANGES=$(mktemp)
      git status --porcelain "$FILES_PATH" | cut -c4- > "$CHANGES_FILE"
      while read -r line; do 
        echo "- \`${line#$FILES_PATH/}\`" >> "$FORMATTED_CHANGES"
      done < "$CHANGES_FILE"
      
      # Create MR body
      BODY_FILE=$(mktemp)
      echo "$MERGE_REQUEST_BODY" | sed -e "/CHANGES_LIST/r $FORMATTED_CHANGES" -e "//d" > "$BODY_FILE"
      
      # Commit and push
      git add .
      git commit -m "$MERGE_REQUEST_TITLE"
      git push origin "$BRANCH_NAME"
      
      # Create merge request via API
      MR_RESPONSE=$(curl -s -X POST \
        -H "PRIVATE-TOKEN: $GITLAB_PUSH_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"source_branch\": \"$BRANCH_NAME\",
          \"target_branch\": \"$CI_DEFAULT_BRANCH\",
          \"title\": \"$MERGE_REQUEST_TITLE\",
          \"description\": $(cat $BODY_FILE | jq -Rs .),
          \"assignee_id\": \"$GITLAB_USER_ID\",
          \"remove_source_branch\": true
        }" \
        "https://$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/merge_requests")
      
      MR_URL=$(echo "$MR_RESPONSE" | jq -r '.web_url // empty')
      if [ -n "$MR_URL" ]; then
        echo "Merge request created: $MR_URL"
      else
        echo "Failed to create MR: $MR_RESPONSE"
        exit 1
      fi
  rules:
    # Only run when manually triggered
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
      when: manual

# ==========================================
# STAGE 2: Auto Deploy After Merge
# ==========================================

validate_and_deploy:
  extends: .descope_base
  stage: deploy_to_production
  variables:
    REQUIRED_VARS: 'MANAGEMENT_KEY PRODUCTION_PROJECT_ID'
    # This job diffs HEAD against its parent to decide whether to deploy, so the
    # parent commit must be in the clone. GitLab's default shallow clone does not
    # guarantee it; depth 2 does, up front, with no runtime fetching.
    GIT_DEPTH: 2
  before_script:
    # Validate configuration before spending time on installs.
    - !reference [.snippets, check_required_vars]
    # Install required tools
    - apt-get update && apt-get install -y curl jq git
    - !reference [.snippets, install_descope_cli]
  script:
    - |
      echo "=== Checking for meaningful ProjectSnapshot changes ==="

      # Check if ProjectSnapshot directory exists
      if [ ! -d "$FILES_PATH" ]; then
        echo "No ProjectSnapshot directory found - skipping deployment"
        exit 0
      fi
      
      echo "Current commit: $CI_COMMIT_SHA"
      echo "Commit message: $CI_COMMIT_MESSAGE"
      
      # Get the previous commit (before this merge). GIT_DEPTH: 2 above guarantees
      # it is present, except on a genuine initial commit (no parent exists).
      if PREVIOUS_COMMIT=$(git rev-parse --verify -q HEAD~1); then
        echo "Previous commit: $PREVIOUS_COMMIT"

        # Check if there are actual content differences in ProjectSnapshot between commits
        if git diff --quiet $PREVIOUS_COMMIT HEAD -- "$FILES_PATH"; then
          echo "No actual content changes detected in ProjectSnapshot between commits"
          echo "Checking if this might be a revert or identical content..."

          # Show what files were touched (even if content is same)
          TOUCHED_FILES=$(git diff --name-only $PREVIOUS_COMMIT HEAD -- "$FILES_PATH")
          if [ -n "$TOUCHED_FILES" ]; then
            echo "Files were touched but content is identical:"
            echo "$TOUCHED_FILES"
            echo "This appears to be a revert or duplicate change - skipping deployment"
          else
            echo "No files in ProjectSnapshot were modified at all"
          fi

          exit 0
        fi

        echo "=== Meaningful ProjectSnapshot changes detected ==="
        echo "Files with actual content changes:"
        git diff --name-only $PREVIOUS_COMMIT HEAD -- "$FILES_PATH"

        echo "=== Summary of changes ==="
        git diff --stat $PREVIOUS_COMMIT HEAD -- "$FILES_PATH"
      else
        echo "HEAD has no parent (initial commit) - nothing to diff against"
        echo "Proceeding with deployment"
      fi

      echo "=== Validating Snapshot ==="
      export DESCOPE_MANAGEMENT_KEY=$MANAGEMENT_KEY
      # DESCOPE_BASE_URL, if set as a CI/CD variable, is already in the job env
      if [ -n "$DESCOPE_BASE_URL" ]; then echo "Using Descope base URL: $DESCOPE_BASE_URL"; fi
      descope project snapshot validate "$PRODUCTION_PROJECT_ID" --path "$FILES_PATH"
      echo "Validation completed successfully"
      
      echo "=== Deploying to Production ==="
      descope project snapshot import "$PRODUCTION_PROJECT_ID" --path "$FILES_PATH"
      echo "Production deployment completed successfully"
  rules:
    # Only run on main branch when it's a push (merge) - NOT on manual pipeline triggers
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Never run on manual pipeline triggers or other sources
    - when: never

# ==========================================
# Required GitLab CI/CD Variables
# ==========================================
# - STAGING_PROJECT_ID: Your Descope staging project ID
# - MANAGEMENT_KEY: Your Descope management key (protected/masked)
# - PRODUCTION_PROJECT_ID: Your Descope production project ID
# - GITLAB_PUSH_TOKEN: Access token with the api, read_repository and write_repository
#                      scopes, and the Developer role (or higher)
#
# Optional:
# - DESCOPE_BASE_URL: Descope API base URL, if not using the default US region
#                     (e.g. https://api.euc1.descope.com for the EU region)